spring.application.name=Printfx

# Database: Azure supplies these via App Service environment variables;
# the values after the colon are your local defaults
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dmg}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1234}

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mail: password is never stored in this file
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:kollasaiakhil@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App settings
dmg.approval-email=${DMG_APPROVAL_EMAIL:kollasaiakhil@gmail.com}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}