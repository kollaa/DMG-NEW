<div class="page-wrapper">
  <div class="login-container">
    <h2 class="loginHeader">Marketing Materials Hub</h2>

    <form (ngSubmit)="onSubmit()" [formGroup]="loginForm">

      <div class="field-group">
        <input
          id="email"
          type="email"
          placeholder="Username"
          formControlName="email"
          autocomplete="username"
          [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
        />
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Please enter a valid email.
        </div>
      </div>

      <div class="field-group">
        <input
          id="password"
          type="password"
          placeholder="Password"
          formControlName="password"
          autocomplete="current-password"
          [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
        />
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password is required.
        </div>
      </div>

      <div class="error-message global-error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="submit">Login</button>

      <div class="remember-container">
        <label class="remember-me">
          <input type="checkbox" formControlName="rememberMe" /> Remember Me
        </label>
        <div class="forgot-password">
          <a routerLink="/forgotpassword">Forgot Password?</a>
        </div>
      </div>

      <div class="remember-container signup-row">
        <span class="remember-me">Don't have an account?</span>
        <div class="forgot-password">
          <a routerLink="/signup">Sign up</a>
        </div>
      </div>

    </form>
  </div>
</div>
